<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E1B"/>
      <stop offset="100%" stop-color="#0A110F"/>
    </linearGradient>
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E5A3C"/>
      <stop offset="50%" stop-color="#116845"/>
      <stop offset="100%" stop-color="#0E5A3C"/>
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="courtShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 32)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle" letter-spacing="1">
      🏸 STANDAR UKURAN LAPANGAN BULU TANGKIS (BWF)
    </text>
  </g>

  <!-- Court Outline & Field -->
  <!-- Court: 670px width (represents 13.40m), 305px height (represents 6.10m) -->
  <!-- Center: x=480, y=275. Left: 145, Right: 815, Top: 122.5, Bottom: 427.5 -->
  <!-- Ratio: 50 px = 1 meter -->
  <g transform="translate(0, 5)" filter="url(#courtShadow)">
    <!-- Grass / Turf Court Base -->
    <rect x="145" y="122.5" width="670" height="305" rx="6" fill="url(#courtGrad)" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Singles Sidelines (Inner) -> 0.46m inside each side = 23px from top/bottom -->
    <!-- Top: 122.5 + 23 = 145.5; Bottom: 427.5 - 23 = 404.5; Width of singles = 259px (5.18m) -->
    <line x1="145" y1="145.5" x2="815" y2="145.5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="none"/>
    <line x1="145" y1="404.5" x2="815" y2="404.5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="none"/>

    <!-- Doubles Long Service Lines (Inner back lines) -> 0.76m inside = 38px from outer baselines -->
    <!-- Left: 145 + 38 = 183; Right: 815 - 38 = 777 -->
    <line x1="183" y1="122.5" x2="183" y2="427.5" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="777" y1="122.5" x2="777" y2="427.5" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Short Service Lines (1.98m from Net = 99px from Center 480) -->
    <!-- Left Short: 480 - 99 = 381; Right Short: 480 + 99 = 579 -->
    <line x1="381" y1="122.5" x2="381" y2="427.5" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="579" y1="122.5" x2="579" y2="427.5" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Center Line (from short service line to back baseline) -->
    <!-- y = 275 (halfway between 122.5 and 427.5) -->
    <line x1="145" y1="275" x2="381" y2="275" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="579" y1="275" x2="815" y2="275" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Shading for Service Zones (Subtle highlights) -->
    <!-- Left Court - Right Service (Genap) -->
    <rect x="183" y="275" width="198" height="129.5" fill="#3B82F6" fill-opacity="0.12"/>
    <!-- Left Court - Left Service (Ganjil) -->
    <rect x="183" y="145.5" width="198" height="129.5" fill="#10B981" fill-opacity="0.12"/>
    <!-- Right Court - Right Service (Genap) -->
    <rect x="579" y="145.5" width="198" height="129.5" fill="#3B82F6" fill-opacity="0.12"/>
    <!-- Right Court - Left Service (Ganjil) -->
    <rect x="579" y="275" width="198" height="129.5" fill="#10B981" fill-opacity="0.12"/>

    <!-- NET in Center: x=480 -->
    <rect x="477" y="114" width="6" height="322" rx="3" fill="url(#netGrad)" stroke="#0F172A" stroke-width="1"/>
    <!-- Net Mesh pattern lines -->
    <line x1="480" y1="114" x2="480" y2="436" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Net Posts at sides -->
    <circle cx="480" cy="114" r="5" fill="#F87171" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="480" cy="436" r="5" fill="#F87171" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Labels for Service Courts -->
    <text x="282" y="215" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">
      KOTAK KIRI
    </text>
    <text x="282" y="230" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="600" fill="#A7F3D0" text-anchor="middle">
      (Poin Ganjil 1, 3, 5..)
    </text>

    <text x="282" y="340" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">
      KOTAK KANAN
    </text>
    <text x="282" y="355" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="600" fill="#BFDBFE" text-anchor="middle">
      (Poin Genap 0, 2, 4..)
    </text>

    <text x="678" y="215" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">
      KOTAK KANAN
    </text>
    <text x="678" y="230" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="600" fill="#BFDBFE" text-anchor="middle">
      (Poin Genap 0, 2, 4..)
    </text>

    <text x="678" y="340" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">
      KOTAK KIRI
    </text>
    <text x="678" y="355" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="600" fill="#A7F3D0" text-anchor="middle">
      (Poin Ganjil 1, 3, 5..)
    </text>
  </g>

  <!-- Dimension Lines & Annotations -->
  <!-- Top Length Dimension: 13.40 m -->
  <g transform="translate(0, 5)">
    <line x1="145" y1="85" x2="815" y2="85" stroke="#F59E0B" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="145" y1="80" x2="145" y2="115" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="815" y1="80" x2="815" y2="115" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
    <rect x="420" y="72" width="120" height="24" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="480" y="88" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="800" fill="#FBBF24" text-anchor="middle">
      PANJANG: 13,40 m
    </text>
  </g>

  <!-- Left Width Dimensions: 6.10 m (Doubles) & 5.18 m (Singles) -->
  <g transform="translate(0, 5)">
    <!-- Total Width 6.10 m -->
    <line x1="105" y1="122.5" x2="105" y2="427.5" stroke="#F59E0B" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="100" y1="122.5" x2="140" y2="122.5" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="100" y1="427.5" x2="140" y2="427.5" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
    <g transform="translate(95, 275) rotate(-90)">
      <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="4" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="800" fill="#FBBF24" text-anchor="middle">
        GANDA: 6,10 m
      </text>
    </g>

    <!-- Singles Width 5.18 m -->
    <line x1="125" y1="145.5" x2="125" y2="404.5" stroke="#38BDF8" stroke-width="1.5" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(133, 275) rotate(-90)">
      <text x="0" y="-3" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">
        Tunggal: 5,18 m
      </text>
    </g>
  </g>

  <!-- Short Service Distance Dimension: 1.98 m -->
  <g transform="translate(0, 5)">
    <line x1="381" y1="445" x2="480" y2="445" stroke="#38BDF8" stroke-width="1.5" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
    <line x1="381" y1="430" x2="381" y2="455" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="480" y1="438" x2="480" y2="455" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="430.5" y="465" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">
      1,98 m (Garis Servis Pendek)
    </text>
  </g>

  <!-- Doubles Long Service Distance: 0.76 m -->
  <g transform="translate(0, 5)">
    <line x1="145" y1="445" x2="183" y2="445" stroke="#F59E0B" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="145" y1="430" x2="145" y2="455" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="183" y1="430" x2="183" y2="455" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="164" y="465" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">
      0,76 m
    </text>
  </g>

  <!-- Net Height Indicator -->
  <g transform="translate(480, 480)">
    <rect x="-190" y="-14" width="380" height="28" rx="14" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
    <text x="0" y="4" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">
      TINGGI NET: 1,55 m (di tiang samping) &amp; 1,524 m (di tengah lapangan)
    </text>
  </g>

  <!-- Side boundary guide legend -->
  <g transform="translate(830, 240)">
    <rect x="0" y="-50" width="115" height="120" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="10" y="-32" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="800" fill="#F8FAFC">KETERANGAN:</text>

    <line x1="10" y1="-18" x2="30" y2="-18" stroke="#F59E0B" stroke-width="3"/>
    <text x="36" y="-15" font-family="Poppins, Arial, sans-serif" font-size="9" fill="#CBD5E1">Batas Ganda</text>

    <line x1="10" y1="-2" x2="30" y2="-2" stroke="#38BDF8" stroke-width="3"/>
    <text x="36" y="1" font-family="Poppins, Arial, sans-serif" font-size="9" fill="#CBD5E1">Batas Tunggal</text>

    <rect x="10" y="14" width="18" height="10" fill="#3B82F6" fill-opacity="0.3" stroke="#3B82F6" stroke-width="1"/>
    <text x="36" y="22" font-family="Poppins, Arial, sans-serif" font-size="9" fill="#CBD5E1">Servis Genap</text>

    <rect x="10" y="32" width="18" height="10" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="36" y="40" font-family="Poppins, Arial, sans-serif" font-size="9" fill="#CBD5E1">Servis Ganjil</text>
  </g>
</svg>
